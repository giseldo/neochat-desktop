<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NeoChat Desktop</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-app-region: drag;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #090d16;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .splash-card {
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 20%, rgba(59, 130, 246, 0.15), transparent 70%),
                  linear-gradient(180deg, #0f172a 0%, #090d16 100%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 32px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      position: relative;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }

    .logo-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 12px;
      position: relative;
    }

    .logo-glow {
      position: absolute;
      width: 80px;
      height: 80px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.45) 0%, rgba(99, 102, 241, 0.2) 60%, transparent 80%);
      filter: blur(16px);
      border-radius: 50%;
      top: -6px;
      z-index: 0;
      animation: pulse-glow 3s infinite alternate ease-in-out;
    }

    .logo-badge {
      width: 68px;
      height: 68px;
      border-radius: 18px;
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border: 1px solid rgba(255, 255, 255, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 1;
      box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.4);
    }

    .logo-badge svg {
      width: 38px;
      height: 38px;
      filter: drop-shadow(0 2px 8px rgba(56, 189, 248, 0.5));
    }

    .brand-section {
      text-align: center;
      margin-top: 16px;
      z-index: 1;
    }

    .brand-title {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .brand-title .accent {
      background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .version-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 9999px;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.25);
      color: #38bdf8;
      vertical-align: middle;
      letter-spacing: 0.3px;
    }

    .tagline {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 5px;
      font-weight: 400;
      letter-spacing: 0.2px;
    }

    .loader-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
      z-index: 1;
    }

    .progress-track {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 9999px;
      overflow: hidden;
      position: relative;
    }

    .progress-indicator {
      width: 45%;
      height: 100%;
      background: linear-gradient(90deg, #0ea5e9, #6366f1, #a855f7);
      border-radius: 9999px;
      position: absolute;
      animation: indeterminate 1.8s infinite ease-in-out;
    }

    .status-text {
      font-size: 11.5px;
      color: #64748b;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot-pulse {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: #38bdf8;
      animation: pulse-dot 1.4s infinite ease-in-out;
    }

    @keyframes indeterminate {
      0% {
        left: -40%;
        width: 30%;
      }
      50% {
        left: 30%;
        width: 50%;
      }
      100% {
        left: 100%;
        width: 30%;
      }
    }

    @keyframes pulse-glow {
      0% {
        opacity: 0.4;
        transform: scale(0.92);
      }
      100% {
        opacity: 0.8;
        transform: scale(1.08);
      }
    }

    @keyframes pulse-dot {
      0%, 100% {
        opacity: 0.4;
        transform: scale(0.8);
      }
      50% {
        opacity: 1;
        transform: scale(1.2);
      }
    }
  </style>
</head>
<body>
  <div class="splash-card">
    <div class="logo-container">
      <div class="logo-glow"></div>
      <div class="logo-badge">
        <!-- Modern Neo Logo SVG -->
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M2 17L12 22L22 17" stroke="#818cf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M2 12L12 17L22 12" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
    </div>

    <div class="brand-section">
      <h1 class="brand-title">
        <span id="app-name">NeoChat</span>
        <span class="accent">Desktop</span>
        <span id="app-version" class="version-badge">v0.0.11</span>
      </h1>
      <p class="tagline">AI Workspace & Multi-Agent Runtime</p>
    </div>

    <div class="loader-section">
      <div class="progress-track">
        <div class="progress-indicator"></div>
      </div>
      <div class="status-text">
        <span class="dot-pulse"></span>
        <span id="status-label">Iniciando o aplicativo...</span>
      </div>
    </div>
  </div>

  <script>
    (function () {
      try {
        const params = new URLSearchParams(window.location.search);
        const name = params.get('name');
        const version = params.get('version');
        if (name) {
          const parts = name.split(' ');
          const nameEl = document.getElementById('app-name');
          if (nameEl) nameEl.textContent = parts[0] || name;
        }
        if (version) {
          const verEl = document.getElementById('app-version');
          if (verEl) verEl.textContent = version.startsWith('v') ? version : ('v' + version);
        }
      } catch (err) {
        console.warn('Could not parse splash parameters:', err);
      }
    })();
  </script>
</body>
</html>
