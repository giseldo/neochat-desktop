appId: com.neochat.desktop
productName: NeoChat Desktop
artifactName: "NeoChat-Desktop.${ext}"
copyright: "Copyright © 2026 Neo"

directories:
  buildResources: public
  output: release

files:
  - dist/**/*
  - electron/**/*
  - shared/**/*
  - node_modules/**/*

# macOS Configuration
mac:
  category: public.app-category.productivity
  target:
    - dmg
    - zip
  artifactName: "NeoChat-Desktop.${ext}"
  icon: public/icon.png
  darkModeSupport: true
  hardenedRuntime: true
  gatekeeperAssess: false

# Windows Configuration
win:
  target:
    - nsis
    - portable
  icon: public/icon.png
  requestedExecutionLevel: asInvoker

nsis:
  artifactName: "NeoChat-desktop-Setup.${ext}"
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: NeoChat
  runAfterFinish: true
  deleteAppDataOnUninstall: false

portable:
  artifactName: "NeoChat-desktop-Portable.${ext}"

# Linux Configuration
linux:
  target:
    - AppImage
    - deb
    - rpm
  artifactName: "NeoChat-Desktop.${ext}"
  category: Development
  synopsis: Local Desktop chat app with MCP support
  description: Chat interface with image support and local MCP servers
  vendor: Neo
  maintainer: Neo
  icon: public/icon.png
  executableName: neochat-desktop

publish:
  provider: github
  owner: giseldo
  repo: neochat-desktop

# Ensure executable permissions are set
asarUnpack:
  - "electron/scripts/*.sh"
  - "electron/scripts/*.cmd"
  - "electron/scripts/*.ps1"
