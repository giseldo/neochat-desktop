name: Quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm security:audit
      - run: pnpm lint --quiet
      - run: pnpm lint:critical
      - run: pnpm test:core
      - run: pnpm test:startup
      - run: pnpm build
      - name: Verify Windows package layout
        run: pnpm exec electron-builder --dir --win --config.directories.output="$env:RUNNER_TEMP\neochat-package"
