name: Release NeoChat Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            run_cmd: pnpm release:win
          - os: macos-latest
            platform: mac
            run_cmd: pnpm release:mac
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Version Tag
        shell: bash
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_NAME="${GITHUB_REF_NAME}"
          echo "Package version: ${PKG_VERSION}"
          echo "Triggered tag: ${TAG_NAME}"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            EXPECTED_TAG="v${PKG_VERSION}"
            if [ "${TAG_NAME}" != "${EXPECTED_TAG}" ]; then
              echo "::error::Tag '${TAG_NAME}' does not match package.json version '${PKG_VERSION}' (expected '${EXPECTED_TAG}')"
              exit 1
            fi
          fi

      - name: Build & Publish Release
        run: ${{ matrix.run_cmd }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Unversioned Latest Assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/prepare-latest-assets.js
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_NAME="${GITHUB_REF_NAME:-v$PKG_VERSION}"
          echo "Uploading unversioned assets to release tag: ${TAG_NAME}"
          cd release
          for f in *; do
            if [ -f "$f" ] && [[ "$f" =~ \.(exe|dmg|zip|AppImage|deb|rpm)$ ]] && [[ ! "$f" =~ "$PKG_VERSION" ]]; then
              echo "Uploading unversioned asset '$f' to ${TAG_NAME}..."
              gh release upload "${TAG_NAME}" "$f" --clobber || true
            fi
          done

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neochat-${{ matrix.platform }}-${{ github.ref_name || 'build' }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: warn
