name: Release NeoChat Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    name: Build & Publish Windows Release
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Validate Version Tag
        shell: bash
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_NAME="${GITHUB_REF_NAME}"
          echo "Package version: ${PKG_VERSION}"
          echo "Triggered tag: ${TAG_NAME}"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            EXPECTED_TAG="v${PKG_VERSION}"
            if [ "${TAG_NAME}" != "${EXPECTED_TAG}" ]; then
              echo "::error::Tag '${TAG_NAME}' does not match package.json version '${PKG_VERSION}' (expected '${EXPECTED_TAG}')"
              exit 1
            fi
          fi

      - name: Build & Publish Release
        run: pnpm release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neochat-windows-${{ github.ref_name || 'build' }}
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: warn
