name: Release NeoChat Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release Binaries (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            run_cmd: pnpm dist:win
          - os: macos-latest
            platform: mac
            run_cmd: pnpm dist:mac
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Version Tag
        shell: bash
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_NAME="${GITHUB_REF_NAME}"
          echo "Package version: ${PKG_VERSION}"
          echo "Triggered tag: ${TAG_NAME}"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            EXPECTED_TAG="v${PKG_VERSION}"
            if [ "${TAG_NAME}" != "${EXPECTED_TAG}" ]; then
              echo "::error::Tag '${TAG_NAME}' does not match package.json version '${PKG_VERSION}' (expected '${EXPECTED_TAG}')"
              exit 1
            fi
          fi

      - name: Build Release Binaries
        run: ${{ matrix.run_cmd }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Platform Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error

  publish:
    name: Publish Unified GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [[ "${GITHUB_REF_NAME}" =~ ^v[0-9] ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
          else
            TAG_NAME="v${PKG_VERSION}"
          fi
          TITLE="NeoChat Desktop ${TAG_NAME}"
          
          mkdir -p release-files
          find all-artifacts -type f -exec cp {} release-files/ \;
          
          echo "Files to publish:"
          ls -la release-files/
          
          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            echo "Updating existing release ${TAG_NAME}..."
            gh release upload "${TAG_NAME}" release-files/* --clobber
            gh release edit "${TAG_NAME}" --draft=false --latest --title "${TITLE}"
          else
            echo "Creating new release ${TAG_NAME}..."
            gh release create "${TAG_NAME}" release-files/* --title "${TITLE}" --generate-notes --latest
          fi
