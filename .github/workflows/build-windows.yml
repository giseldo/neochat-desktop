name: Build Windows Electron App (CI)

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up pnpm
      uses: pnpm/action-setup@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Verify core behavior
      run: pnpm test:core

    - name: Build Windows Electron App
      run: pnpm dist:win

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: neochat-windows-ci-${{ github.sha }}
        path: |
          release/*.exe
          release/*.blockmap
          release/latest.yml
        if-no-files-found: warn
