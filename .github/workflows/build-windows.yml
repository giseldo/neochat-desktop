name: Build Windows Electron App

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up pnpm
      uses: pnpm/action-setup@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install

    - name: Extract App Info
      id: get_info
      shell: bash
      run: |
        APP_VERSION=$(node -p "require('./package.json').version")
        PRODUCT_NAME=$(node -p "require('./package.json').build.productName || require('./package.json').name")
        SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
        BUILD_TIMESTAMP=$(date +'%Y%m%d%H%M')
        echo "APP_VERSION=${APP_VERSION}" >> $GITHUB_ENV
        echo "PRODUCT_NAME=${PRODUCT_NAME}" >> $GITHUB_ENV
        echo "SHORT_SHA=${SHORT_SHA}" >> $GITHUB_ENV
        echo "BUILD_TIMESTAMP=${BUILD_TIMESTAMP}" >> $GITHUB_ENV

    - name: Build Windows Electron App
      run: pnpm dist:win
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Create or Update GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          release/*.exe
          release/*.blockmap
          release/latest.yml
        tag_name: v${{ env.APP_VERSION }}
        name: NeoChat Desktop v${{ env.APP_VERSION }}
        body: |
          NeoChat Desktop release v${{ env.APP_VERSION }}.
          Commit: ${{ github.sha }}
          Short SHA: ${{ env.SHORT_SHA }}
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
